<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <defs>
    <linearGradient id="te" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#1FA855"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="tb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D2B1F"/>
      <stop offset="100%" stop-color="#2A1B10"/>
    </linearGradient>
    <linearGradient id="tl1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="100%" stop-color="#1B5E3B"/>
    </linearGradient>
    <linearGradient id="tl2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#28A745"/>
    </linearGradient>
    <filter id="tg-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Mini tree icon -->
  <rect x="10" y="28" width="10" height="32" rx="2" fill="url(#tb)"/>
  <rect x="2" y="18" width="26" height="8" rx="4" fill="url(#tl1)" opacity="0.9"/>
  <rect x="-2" y="24" width="34" height="8" rx="4" fill="url(#tl2)" opacity="0.8"/>
  <rect x="2" y="30" width="26" height="6" rx="3" fill="url(#tl1)" opacity="0.7"/>
  <polygon points="15,36 18,42 15,48 12,42" fill="url(#te)" filter="url(#tg-glow)" opacity="0.8"/>
  <circle cx="4" cy="22" r="1.5" fill="#3DDC84" filter="url(#tg-glow)" opacity="0.5"/>
  <!-- Text -->
  <text x="44" y="40" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="url(#te)" filter="url(#tg-glow)">ZungleVibe</text>
  <text x="44" y="58" font-family="Arial, sans-serif" font-weight="400" font-size="10" fill="url(#tg)" letter-spacing="6">HOSTING</text>
</svg>
