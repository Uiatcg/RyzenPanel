  <path d="M256 160v80l40 20" stroke="#34d399" stroke-width="2" opacity="0.4" fill="none"/>
  <path d="M368 256H320" stroke="#10b981" stroke-width="2" opacity="0.6" fill="none"/>
  <circle cx="368" cy="256" r="4" fill="#34d399" opacity="0.8"/>
